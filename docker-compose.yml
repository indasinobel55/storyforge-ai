services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/studio.db
      STORAGE_DIR: /app/data/storage
      EXECUTION_MODE: ${EXECUTION_MODE:-cloud}
    ports:
      - "8000:8000"
    volumes:
      - studio_data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "workers.runner"]
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/studio.db
      STORAGE_DIR: /app/data/storage
      EXECUTION_MODE: ${EXECUTION_MODE:-cloud}
    volumes:
      - studio_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  studio_data:
