name: taaft-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install playwright + xvfb
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Probe TAAFT gate (headed under xvfb, fresh session)
        run: xvfb-run -a python scripts/taaft_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe_out/
