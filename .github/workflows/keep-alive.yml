# Keeps Render free-tier services awake by pinging them every 10 minutes
# (Render spins down after ~15 min of inactivity).
#
# Setup: add a repo *variable* (Settings → Secrets and variables → Actions →
# Variables) named RENDER_URLS with a comma-separated list of service URLs, e.g.
#   https://storyforge-frontend-1s1y.onrender.com,https://storyforge-allinone.onrender.com
# If unset, defaults to the known frontend service below.

name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URLS: ${{ vars.RENDER_URLS || 'https://storyforge-allinone.onrender.com' }}
    steps:
      - name: Ping services
        run: |
          STATUS_OVERALL=0
          for url in $(echo "$URLS" | tr ',' ' '); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X GET --max-time 60 --retry 2 --retry-delay 5 -L "$url")
            echo "$url -> $code"
            echo "| URL | Status |"
            echo "| --- | ------ |"
            echo "| $url | $code |"
            case "$code" in
              200|301|302|307|308) ;;
              *) STATUS_OVERALL=1 ;;
            esac
          done
          exit $STATUS_OVERALL
